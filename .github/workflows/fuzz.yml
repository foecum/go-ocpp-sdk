name: Fuzz

# A short fuzzing run of every fuzz target, weekly and on demand. The seed
# corpora also run as ordinary tests in CI.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./ocppj, name: FuzzParse }
          - { pkg: ./ocppj, name: FuzzRegistryDecode }
          - { pkg: ./ocppj, name: FuzzEndpointHandleFrame }
          - { pkg: ., name: FuzzDateTime }
          - { pkg: ./v16, name: FuzzDecode }
          - { pkg: ./v201, name: FuzzDecode }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target.name }}
          path: "**/testdata/fuzz/**"
